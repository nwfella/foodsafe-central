name: refresh-recalls
on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 / 18:00 UTC = twice daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate recall data
        run: python build_data.py --out data/recalls.json

      - name: Commit if changed
        run: |
          if ! git diff --quiet data/recalls.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recalls.json
            git commit -m "chore: refresh recall data [skip ci]"
            git push
          else
            echo "no change - nothing to commit"
          fi
