name: refresh-recalls

# FoodSafe Central: one refresh every 24 hours (FDA openFDA + USDA FSIS),
# then re-bake index.html and publish to GitHub Pages.
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = one full refresh every 24 hours
  workflow_dispatch: {}    # manual "refresh now"

permissions:
  contents: write

concurrency:
  group: refresh-recalls
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect FDA + USDA FSIS recalls and bake the page
        run: |
          python build_data.py --out data/recalls.json
          python bake.py
          python - <<'PY'
          import json
          m = json.load(open("data/recalls.json", encoding="utf-8"))["meta"]
          print("agencies:", m["by_agency"], "| new 7d:", m["new_7d"], "| sources:",
                  [(s["name"], s["ok"], s["count"]) for s in m["sources"]])
          PY

      - name: Commit if changed
        run: |
          if ! git diff --quiet data/recalls.json data/fsis_slugs.json index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recalls.json index.html
            [ -f data/fsis_slugs.json ] && git add data/fsis_slugs.json
            git commit -m "chore: daily recall refresh [skip ci]"
            git push
          else
            echo "no change - nothing to commit"
          fi
